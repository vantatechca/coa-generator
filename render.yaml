services:
  - type: web
    name: coa-app
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /sample.csv
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: COA_MODE
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BASE_URL
        sync: false # set to your public URL (e.g. https://coa.yourdomain.com) in the dashboard
    # The app stores lots and uploaded images as files under data/production,
    # so it needs a persistent disk (keep this service at a single instance).
    disk:
      name: coa-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
